name: Release preview

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.22'
          python-version: '3.12'
      - name: Verify release version
        run: |
          uv run --no-project python -c "import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match package version'"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag --prerelease
          --title "MarcoStudio $GITHUB_REF_NAME"
          --notes "Local development preview: Relight with your own ComfyUI. See the README for installation and separate model downloads. Hosted ComfyUI connections and Comfy Cloud are not available in this release."
